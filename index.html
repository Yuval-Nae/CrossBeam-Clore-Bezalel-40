<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="CrossBeam — Clore Bezalel scholarship artists" />
    <title>CrossBeam</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <svg class="filters" width="0" height="0" aria-hidden="true">
      <filter id="ink-gradient-map" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
        <feColorMatrix in="SourceGraphic" type="matrix" result="gray" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0" />
        <feComponentTransfer in="gray">
          <feFuncR type="linear" slope="0" intercept="0.498039" />
          <feFuncG type="linear" slope="0" intercept="0.298039" />
          <feFuncB type="linear" slope="0" intercept="0" />
          <feFuncA type="table" tableValues="1 0" />
        </feComponentTransfer>
      </filter>
    </svg>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-start" id="header-start"></div>
      <nav class="lang-switch" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">en</button>
        <button type="button" data-lang="ar" aria-pressed="false">عر</button>
        <button type="button" data-lang="he" aria-pressed="false">עב</button>
      </nav>
    </header>
    <main id="main"></main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="js/app.js" type="module"></script>
  </body>
</html>
